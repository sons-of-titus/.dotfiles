general {
    grace = 3
    hide_cursor = true
    ignore_empty_password = true
    layout = input_field
    immediate_render = true
}

# Animations
bezier = easeInOut, 0.32, 0.66, 0.18, 1
bezier = bounce, 0.17, 0.89, 0.54, 1.18
animation = fadeIn, 1, 10, easeInOut
animation = fadeOut, 1, 10, easeInOut

# Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 80
    blur_new_optimizations = true
}

# Big clock time
time {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffff, 0.85)
    font_size = 140
    font_family = JetBrains Mono, Fira Code, Noto Sans Mono, monospace
    position = 0, -100
    halign = center
    valign = center
}

# Date
date {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(ffffff, 0.6)
    font_size = 24
    font_family = JetBrains Mono, Fira Code, Noto Sans Mono, monospace
    position = 0, 60
    halign = center
    valign = center
}

# User label
user {
    monitor =
    text = $USER
    color = rgba(ffffff, 0.4)
    font_size = 18
    font_family = JetBrains Mono, Fira Code, Noto Sans Mono, monospace
    position = 0, 100
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    fade_on_empty = true
    placeholder_text = password...
    inner_color = rgba(000000, 0.4)
    outer_color = rgba(ffffff, 0.2)
    placeholder_color = rgba(ffffff, 0.3)
    font_color = rgba(ffffff, 0.9)
    check_color = rgba(102, 194, 165)
    wrong_color = rgba(252, 141, 98)
    position = 0, 200
    halign = center
    valign = center
}

