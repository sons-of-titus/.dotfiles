# Info text
info {
    monitor =
    text = press enter to unlock
    color = rgba(ffffff, 0.25)
    font_size = 14
    font_family = JetBrains Mono, Fira Code, Noto Sans Mono, monospace
    position = 0, 290
    halign = center
    valign = center
}