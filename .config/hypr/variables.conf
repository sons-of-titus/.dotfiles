# ### Hyprland ###
# Apps
$terminal = ghostty
$browser = google-chrome-stable
$editor = neovide
$ide = zed
$fileExplorer = yazi

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 20
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 10
$windowGapsOut = 40
$singleWindowGapsOut = 20

# Window styling
$windowOpacity = 0.95
$windowRounding = 0

$windowBorderSize = 0
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 10
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ### (Simple & Intuitive)
# ======================

# LAUNCHER (fuzzel)
$kbLauncher = Super, Space
$kbLauncherClip = Super, V
$kbLauncherEmoji = Super, Period  

# APPS
$kbTerminal = Super, T
$kbBrowser = Super, B
$kbEditor = Super, E
$kbIde = Super, I
$kbFiles = Super, N

# WORKSPACES (number row + arrows)
$kbGoToWs = Super
$kbMoveToWs = Super+Shift

# WINDOW ACTIONS (Q-F-P-Space)
$kbClose = Super, Q
$kbFullscreen = Super, F
$kbPin = Super, P
$kbFloat = Super, S

# SYSTEM
$kbLock = Ctrl+Alt, L
$kbScreenshot = , Print