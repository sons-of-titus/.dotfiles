# ═══════════════════════════════════════════════════════════════════
# INTUITIVE KEYBINDS
# ═══════════════════════════════════════════════════════════════════

# LAUNCHER ───────────────────────────────────────────────────────
bind = $kbLauncher, exec, fuzzel
bind = $kbLauncherClip, exec, fuzzel --dmenu
bind = $kbLauncherEmoji, exec, fuzzel --dmenu

# APPS ────────────────────────────────────────────────────────────
bind = $kbTerminal, exec, $terminal
bind = $kbBrowser, exec, $browser
bind = $kbEditor, exec, $editor
bind = $kbIde, exec, $ide
bind = $kbFiles, exec, ghostty -e yazi
bind = Super+Shift, E, exec, emacsclient -c

# WORKSPACES: Numbers ───────────────────────────────────────────
bind = $kbGoToWs, 1, workspace, 1
bind = $kbGoToWs, 2, workspace, 2
bind = $kbGoToWs, 3, workspace, 3
bind = $kbGoToWs, 4, workspace, 4
bind = $kbGoToWs, 5, workspace, 5
bind = $kbGoToWs, 6, workspace, 6
bind = $kbGoToWs, 7, workspace, 7
bind = $kbGoToWs, 8, workspace, 8
bind = $kbGoToWs, 9, workspace, 9
bind = $kbGoToWs, 0, workspace, 10

# WORKSPACES: Move window ───────────────────────────────────────
bind = $kbMoveToWs, 1, movetoworkspace, 1
bind = $kbMoveToWs, 2, movetoworkspace, 2
bind = $kbMoveToWs, 3, movetoworkspace, 3
bind = $kbMoveToWs, 4, movetoworkspace, 4
bind = $kbMoveToWs, 5, movetoworkspace, 5
bind = $kbMoveToWs, 6, movetoworkspace, 6
bind = $kbMoveToWs, 7, movetoworkspace, 7
bind = $kbMoveToWs, 8, movetoworkspace, 8
bind = $kbMoveToWs, 9, movetoworkspace, 9
bind = $kbMoveToWs, 0, movetoworkspace, 10

# WORKSPACES: Navigate ──────────────────────────────────────────
bind = $kbGoToWs, right, workspace, +1
bind = $kbGoToWs, left, workspace, -1
bind = $kbGoToWs, mouse_down, workspace, -1
bind = $kbGoToWs, mouse_up, workspace, +1
bind = $kbGoToWs, Page_Down, workspace, +1
bind = $kbGoToWs, Page_Up, workspace, -1

# WINDOW ACTIONS ──────────────────────────────────────────────
bind = $kbClose, killactive
bind = $kbFullscreen, fullscreen
bind = $kbPin, pin
bind = $kbFloat, togglefloating

# WINDOW NAVIGATE ────────────────────────────────────────────
bind = $kbGoToWs, h, movefocus, l
bind = $kbGoToWs, l, movefocus, r
bind = $kbGoToWs, k, movefocus, u
bind = $kbGoToWs, j, movefocus, d

# WINDOW MOVE ────────────────────────────────────────────────
bind = $kbMoveToWs, h, movewindow, l
bind = $kbMoveToWs, l, movewindow, r
bind = $kbMoveToWs, k, movewindow, u
bind = $kbMoveToWs, j, movewindow, d

# SPECIAL WORKSPACES ─────────────────────────────────────────
bind = Super, M, togglespecialworkspace, music
bind = Super, D, togglespecialworkspace, music

# SCREENSHOT ────────���────────────────────────────────────────
bind = $kbScreenshot, exec, grim -g "$(slurp)" - | wl-copy
bind = Super+Shift, S, exec, grim -g "$(slurp -f '%o')" - | wl-copy

# MEDIA ──────────────────────────────────────────────────────
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# VOLUME ───────────────────────────────────────────────────────
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# BRIGHTNESS ────────────────────────────────────────────────
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# LOCK ─────────────────────────────────────────────────────────
bind = $kbLock, exec, swaylock

# WALLPAPER ───────────────────────────────────────────────────
bind = Super, W, exec, ~/.config/hypr/scripts/colorsync.sh once

# POWER ─────────────────────────────────────────────────────────
bind = Super+Shift, O, exec, systemctl poweroff
bind = Super+Shift, R, exec, systemctl reboot
bind = Super+Shift, L, exec, systemctl suspend

# MOUSE ────────────────────────────────────────────────────────
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow